version: '3.8'

services:
  api:
    build: .
    container_name: drone-delivery-api
    ports:
      - "8000:8000"
    volumes:
      # Persist database outside container
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sql_app.db
      - API_V1_STR=/api/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
